<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>BcsMusic</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    .splash {
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 28px;
    }
    /* 大 logo：圆角方块图片，与主界面左上角、icon.png 统一 */
    .logo {
      width: 120px; height: 120px;
      border-radius: 28px;
      object-fit: cover;
      box-shadow: 0 20px 60px -10px rgba(0, 79, 173, 0.35), 0 8px 24px -6px rgba(0,0,0,0.25);
      animation: logoBreath 2s ease-in-out infinite;
    }
    .brand {
      font-size: 22px; font-weight: 600; letter-spacing: 0.02em;
      color: #1a1a1a;
    }
    .brand .accent {
      background: linear-gradient(135deg, #0a0a1a 0%, #004fad 60%, #007aff 100%);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .spinner {
      width: 28px; height: 28px;
      border: 3px solid rgba(0, 122, 255, 0.15);
      border-top-color: #007aff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes logoBreath {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    /* 淡出由主进程控制 .fade-out */
    .splash.fade-out {
      opacity: 0;
      transition: opacity 0.4s ease-out;
    }
  </style>
</head>
<body>
  <div class="splash" id="splash">
    <img class="logo" src="../main/icon.png" alt="BcsMusic">
    <div class="brand">[<span class="accent">BcsMusic</span>]</div>
    <div class="spinner"></div>
  </div>
</body>
</html>
